name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor for `node:sqlite`; 24 is the runtime shipped with
        # DSH 0.2.1 (the version this plugin is built against).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm install`, not `npm ci`: this repo ships pnpm-lock.yaml and has no
      # package-lock.json, so `npm ci` has nothing to install from and fails
      # before reaching the tests. The peer dependencies are DSH internals that
      # only exist on the registry, so a floating resolve is the honest setup
      # here; test/compat.test.js asserts the plugin can judge whatever it gets.
      - run: npm install --no-audit --no-fund
      - run: npm test
